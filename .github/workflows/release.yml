name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # needed only to attach files to a release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build (app folder, installer, portable zip, SHA256SUMS)
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: hermetiks-windows
          path: |
            dist/Hermetiks-Setup*.exe
            dist/Hermetiks-portable-*.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Hermetiks-Setup*.exe dist/Hermetiks-portable-*.zip dist/SHA256SUMS.txt --generate-notes
